# Set all_in_one.mini_ddsp.enabled=true to jointly train the built-in vocoder.
# One command runs acoustic -> variance -> vocoder as separate stages:
# python scripts/binarize.py --config configs/templates/all_in_one_dit.yaml --resume
# Optional vocoder-only preprocessing: python scripts/binarize_vocoder.py --config configs/templates/all_in_one_dit.yaml --resume
# All packages use binary_data_dir/{acoustic,variance,vocoder}; no extra output path.
base_config:
  - configs/original/acoustic.yaml
  - configs/original/variance.yaml

task_cls: training.all_in_one_task.AllInOneTask
binarizer_cls: preprocessing.all_in_one_binarizer.AllInOneBinarizer

# Shared audio/F0/separator settings for all three preprocessing stages.
# These explicit values preserve the inherited acoustic/variance defaults.
audio_sample_rate: 44100
audio_num_mel_bins: 128
hop_size: 512
fft_size: 2048
win_size: 2048
fmin: 40
fmax: 16000
mel_base: e
pe: parselmouth
pe_ckpt: ckpt/rmvpe/model.pt
f0_min: 40
f0_max: 2000
hnsep: world
hnsep_ckpt: ckpt/vr/model.pt
# Work sample rate if hnsep is changed to vr.
hnsep_sample_rate: 44100
# Used only when mini_ddsp.enabled=true; nsf-hifigan remains an explicit option.
all_in_one_vocoder_backend: mini-ddsp

all_in_one:
  enabled: true
  mini_ddsp:
    enabled: false
    harmonics: 128
    noise_bands: 64
    hidden_size: 256
    num_layers: 3
    kernel_size: 31
    harmonic_group_size: 16
    harmonic_analysis_cycles: 4
    segment_frames: 128
    training_augmentation:
      random_crop: true
      volume_enabled: true
      log_volume_min: -1.0
      log_volume_max: 1.0
    warmup_steps: 2000
    joint_ramp_steps: 2000
    loss:
      spectral_weight: 1.0
      amplitude_weight: 0.3
      uv_weight: 0.0
      joint_weight: 1.0

# Optional all-in-one validation preview. Each validation epoch samples one
# segment from a language different from the previous epoch, predicts all
# enabled variances, then logs one mel/audio preview per speaker with val data.
val_with_variance:
  enable: false
  # zh:
  #   - samples/02_不老梦_variance.ds
  # en:
  #   - path/to/english.ds

# The same raw corpus is independently binarized into acoustic and variance
# representations under binary_data_dir/{acoustic,variance}.
dictionaries:
  zh: dictionaries/opencpop-extension.txt
all_phonemes: [AP, SP]
extra_phonemes: []
merged_phoneme_groups: []

datasets:
  - raw_data_dir: data/opencpop
    speaker: opencpop
    spk_id: 0
    language: zh
    artifact_level: 0
    test_prefixes:
      - prefix_1
      - prefix_2

binary_data_dir: data/opencpop/binary-all-in-one
aux_datasets:
  enable: false
  module:
    - pitch
    - voicing
  datasets:
    # Use raw dataset directories like datasets[].raw_data_dir.
    # Manually refined singing is recommended.
    data:
      - zh: data/opencpop
      - en: data/english-singing
    val:
      zh:
        - prefix_1
        - prefix_2
      en: []
  spk_ids: []  # empty for automatic IDs, or one ID per data entry

binarization_args:
  resume: false  # --resume reuses complete packages and resumes checkpoints.
  checkpoint_interval: 16  # Set 1 to commit every source plus its augmentations.
  shuffle: true
  num_workers: 0
  prefer_ds: false
  allow_missing_phonemes: false

use_lang_id: false
num_lang: 1
use_spk_id: false
num_spk: 1
use_artifact_embed: false

# Acoustic conditioning includes every supported variance curve.
use_energy_embed: true
use_breathiness_embed: true
use_voicing_embed: true
use_tension_embed: true
use_key_shift_embed: true
use_speed_embed: true

# Enable only the predictors needed for this experiment.
predict_dur: true
predict_pitch: true
predict_energy: true
predict_breathiness: true
predict_voicing: true
predict_tension: true

dit_contract:
  version: 1
  valid_mask_source: mel2ph
  valid_mask_true_is_valid: true
  padded_batches_require_mask: true

backbone_type: dit
backbone_args:
  num_layers: 8
  num_channels: 384
  num_heads: 6
  mlp_ratio: 4
  time_embed_dim: 256
  patch_size: 1
  rope_base: 10000.0
  layer_norm_eps: 0.000001
  attention_dropout: 0.0
  mlp_dropout: 0.0
  use_gradient_checkpointing: true

pitch_prediction_args:
  backbone_type: dit
  backbone_args:
    num_layers: 4
    num_channels: 256
    num_heads: 4
    mlp_ratio: 4
    time_embed_dim: 256
    patch_size: 1
    rope_base: 10000.0
    layer_norm_eps: 0.000001
    attention_dropout: 0.0
    mlp_dropout: 0.0
    use_gradient_checkpointing: true

variances_prediction_args:
  backbone_type: dit
  backbone_args:
    num_layers: 4
    num_channels: 256
    num_heads: 4
    mlp_ratio: 4
    time_embed_dim: 256
    patch_size: 1
    rope_base: 10000.0
    layer_norm_eps: 0.000001
    attention_dropout: 0.0
    mlp_dropout: 0.0
    use_gradient_checkpointing: true

diffusion_type: reflow
sampling_algorithm: euler
sampling_steps: 20
time_scale_factor: 1000
use_shallow_diffusion: true
T_start: 0.4
T_start_infer: 0.4

val_with_vocoder: false
max_batch_frames: 1536
max_batch_size: 2
max_val_batch_frames: 768
max_val_batch_size: 1
max_sample_frames: 768
accumulate_grad_batches: 8
clip_grad_norm: 1.0

inference_max_frames: 2048
inference_dit_warmup_frames: [128, 512, 768, 1024]

optimizer_args:
  optimizer_cls: torch.optim.AdamW
  lr: 0.0003
  weight_decay: 0.0
lr_scheduler_args:
  scheduler_cls: torch.optim.lr_scheduler.SequentialLR
  schedulers:
    - cls: torch.optim.lr_scheduler.LinearLR
      start_factor: 0.01
      end_factor: 1.0
      total_iters: 1000
    - cls: torch.optim.lr_scheduler.StepLR
      step_size: 5000
      gamma: 0.8
  milestones: [1000]

lora:
  enabled: false
  rank: 8
  alpha: 16
  target_modules:
    - '^acoustic\.diffusion\.(denoise_fn|velocity_fn)\.blocks\.[0-9]+\.(attn\.(qkv|proj)|mlp\.(fc1|fc2))$'
    - '^variance\.(pitch_predictor|variance_predictor)\.(denoise_fn|velocity_fn)\.blocks\.[0-9]+\.(attn\.(qkv|proj)|mlp\.(fc1|fc2))$'
  base_ckpt: null
  train_bias: false
  merge_before_export: true
