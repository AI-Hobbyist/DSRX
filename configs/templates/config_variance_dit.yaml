base_config:
  - configs/original/variance.yaml

# User-editable DiT variance template. Enable only the predictors required by
# the dataset; duration prediction keeps the existing non-DiT implementation.
dictionaries:
  zh: dictionaries/opencpop-extension.txt
all_phonemes: [AP, SP]
extra_phonemes: []
merged_phoneme_groups: []

datasets:
  - raw_data_dir: data/xxx/raw
    speaker: speaker
    spk_id: 0
    language: zh
    test_prefixes:
      - wav1

binary_data_dir: data/xxx/binary
aux_datasets:
  enable: false
  module:
    - pitch
    - voicing
  datasets:
    # Use raw dataset directories like datasets[].raw_data_dir.
    # Manually refined singing is recommended.
    data:
      - zh: data/opencpop
      - en: data/english-singing
    val:
      zh:
        - prefix_1
        - prefix_2
      en: []
  spk_ids: []  # empty for automatic IDs, or one ID per data entry

binarization_args:
  num_workers: 0
  allow_missing_phonemes: false

use_lang_id: false
num_lang: 1
use_spk_id: false
num_spk: 1
predict_dur: false
predict_pitch: false
predict_energy: false
predict_breathiness: false
predict_voicing: false
predict_tension: false

dit_contract:
  version: 1
  valid_mask_source: mel2ph
  valid_mask_true_is_valid: true
  padded_batches_require_mask: true

pitch_prediction_args:
  backbone_type: dit
  backbone_args:
    num_layers: 4
    num_channels: 256
    num_heads: 4
    mlp_ratio: 4
    time_embed_dim: 256
    patch_size: 1
    rope_base: 10000.0
    layer_norm_eps: 0.000001
    attention_dropout: 0.0
    mlp_dropout: 0.0
    use_gradient_checkpointing: true

variances_prediction_args:
  backbone_type: dit
  backbone_args:
    num_layers: 4
    num_channels: 256
    num_heads: 4
    mlp_ratio: 4
    time_embed_dim: 256
    patch_size: 1
    rope_base: 10000.0
    layer_norm_eps: 0.000001
    attention_dropout: 0.0
    mlp_dropout: 0.0
    use_gradient_checkpointing: true

diffusion_type: reflow
sampling_algorithm: euler
sampling_steps: 20
time_scale_factor: 1000

max_batch_frames: 768
max_batch_size: 1
max_val_batch_frames: 768
max_val_batch_size: 1
max_sample_frames: 768
accumulate_grad_batches: 8
clip_grad_norm: 1.0

inference_max_frames: 2048
inference_dit_warmup_frames: [128, 512, 768, 1024]

lora:
  enabled: false
  rank: 8
  alpha: 16
  target_modules:
    - '^(pitch_predictor|variance_predictor)\.(denoise_fn|velocity_fn)\.blocks\.[0-9]+\.attn\.(qkv|proj)$'
    - '^(pitch_predictor|variance_predictor)\.(denoise_fn|velocity_fn)\.blocks\.[0-9]+\.mlp\.(fc1|fc2)$'
  base_ckpt: null
  train_bias: false
  merge_before_export: true