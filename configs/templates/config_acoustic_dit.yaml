base_config:
  - configs/original/acoustic.yaml

# User-editable DiT acoustic template.
dictionaries:
  zh: dictionaries/opencpop-extension.txt
all_phonemes: [AP, SP]
extra_phonemes: []
merged_phoneme_groups: []

datasets:
  - raw_data_dir: data/xxx/raw
    speaker: speaker
    spk_id: 0
    language: zh
    artifact_level: 0
    test_prefixes:
      - wav1

binary_data_dir: data/xxx/binary
binarization_args:
  num_workers: 0
  allow_missing_phonemes: false

vocoder: NsfHifiGAN
vocoder_ckpt: ckpt/nsf_hifigan/model.ckpt

use_lang_id: false
num_lang: 1
use_spk_id: false
num_spk: 1
use_artifact_embed: false
use_energy_embed: false
use_breathiness_embed: false
use_voicing_embed: false
use_tension_embed: false
use_key_shift_embed: true
use_speed_embed: true

dit_contract:
  version: 1
  valid_mask_source: mel2ph
  valid_mask_true_is_valid: true
  padded_batches_require_mask: true

backbone_type: dit
backbone_args:
  num_layers: 8
  num_channels: 384
  num_heads: 6
  mlp_ratio: 4
  time_embed_dim: 256
  patch_size: 1
  rope_base: 10000.0
  layer_norm_eps: 0.000001
  attention_dropout: 0.0
  mlp_dropout: 0.0
  use_gradient_checkpointing: true

diffusion_type: reflow
sampling_algorithm: euler
sampling_steps: 20
time_scale_factor: 1000
use_shallow_diffusion: true
T_start: 0.4
T_start_infer: 0.4

max_batch_frames: 768
max_batch_size: 1
max_val_batch_frames: 768
max_val_batch_size: 1
max_sample_frames: 768
accumulate_grad_batches: 8
clip_grad_norm: 1.0

optimizer_args:
  optimizer_cls: torch.optim.AdamW
  lr: 0.0003
  weight_decay: 0.0
lr_scheduler_args:
  scheduler_cls: torch.optim.lr_scheduler.SequentialLR
  schedulers:
    - cls: torch.optim.lr_scheduler.LinearLR
      start_factor: 0.01
      end_factor: 1.0
      total_iters: 1000
    - cls: torch.optim.lr_scheduler.StepLR
      step_size: 5000
      gamma: 0.8
  milestones: [1000]

inference_max_frames: 2048
inference_dit_warmup_frames: [128, 512, 768, 1024]

lora:
  enabled: false
  rank: 8
  alpha: 16
  target_modules:
    - '^diffusion\.(denoise_fn|velocity_fn)\.blocks\.[0-9]+\.attn\.(qkv|proj)$'
    - '^diffusion\.(denoise_fn|velocity_fn)\.blocks\.[0-9]+\.mlp\.(fc1|fc2)$'
  base_ckpt: null
  train_bias: false
  merge_before_export: true