# Mini-DDSP preprocessing and standalone training share this configuration.
# python scripts/binarize_vocoder.py --config configs/vocoder/mini_ddsp_train.yaml --resume
# python scripts/train.py --config configs/vocoder/mini_ddsp_train.yaml --exp_name mini_ddsp_pretrain
base_config:
  - configs/original/base.yaml

binary_data_dir: data/pre/binary/all_in_one_mini_ddsp_cloud

datasets:
- raw_data_dir: data/opencpop_zh
  speaker: opencpop
  spk_id: 0
  language: zh
  test_prefixes:
  - '2033001224'
  - '2070002621'
  - '2012000457'
  - '2003000103'
  - '2082003039'

# Shared waveform, mel and pitch contract; no model/network settings.
audio_sample_rate: 44100
audio_num_mel_bins: 128
hop_size: 512
fft_size: 2048
win_size: 2048
fmin: 40
fmax: 16000
mel_base: e
pe: rmvpe
pe_ckpt: ckpt/rmvpe/model.pt
f0_min: 40
f0_max: 2000
hnsep: vr
hnsep_ckpt: ckpt/vr/model.pt
hnsep_sample_rate: 44100

# Preprocessing settings.
binarization_args:
  resume: false  # CLI --resume overrides this; keep completed/partial packages.
  checkpoint_interval: 16  # Source groups per checkpoint; use 1 for every source.
  num_workers: 2

task_cls: training.vocoder_task.MiniDDSPTask

# This shared namespace describes the same Mini-DDSP used by AIO. The task
# instantiates only MiniDDSP, without acoustic/variance models or dictionaries.
all_in_one:
  enabled: true
  mini_ddsp:
    enabled: true
    harmonics: 128
    harmonic_analysis_cycles: 4
    noise_bands: 64
    hidden_size: 256
    num_layers: 3
    kernel_size: 31
    harmonic_group_size: 16
    segment_frames: 128
    training_augmentation:
      random_crop: true
      volume_enabled: true
      log_volume_min: -1.0
      log_volume_max: 1.0
    loss:
      spectral_weight: 1.0
      amplitude_weight: 0.3

optimizer_args:
  optimizer_cls: torch.optim.AdamW
  lr: 0.0006
  weight_decay: 0.0
lr_scheduler_args:
  scheduler_cls: torch.optim.lr_scheduler.StepLR
  step_size: 5000
  gamma: 0.8

ds_workers: 4
dataloader_prefetch_factor: 2
pl_trainer_accelerator: gpu
pl_trainer_devices: 1
pl_trainer_precision: bf16-mixed
max_batch_frames: 16000
max_batch_size: 16
max_val_batch_frames: 60000
max_val_batch_size: 1
max_updates: 200ep
val_check_interval: 1ep
num_valid_plots: 5
num_ckpt_keep: 5
permanent_ckpt_start: 0
permanent_ckpt_interval: 0
