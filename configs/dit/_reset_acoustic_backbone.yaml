# Keep this file as a separate cascade layer. A mapping in a child config is
# merged key by key, so setting the inherited mapping to null first prevents
# LYNXNet-specific arguments from leaking into the DiT contract.
backbone_args: null

# Rebuild optimizer arguments without inherited Muon-only fields.
optimizer_args: null

# Rebuild the DiT learning-rate schedule without inherited StepLR fields.
lr_scheduler_args: null