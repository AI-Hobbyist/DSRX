baseline:
  branch: DSRX_DiT
  commit: caa651f0a68d59c572915dc3dae2994d288a5f09
  legacy_backbones: [wavenet, lynxnet, lynxnet2]
  checkpoint_config: ckpt/<exp_name>/config.yaml
  checkpoint_config_is_flattened: true
  workspace_artifacts:
    acoustic_checkpoint: null
    variance_checkpoint: null
    pitch_extractor: ckpt/rmvpe/model.pt
    vocoder: ckpt/kouon_nsf-hifigan_1031/kouon_nsf-hifigan_1031_44100hz_512hop_128bin.ckpt
  numerical_legacy_checkpoint_regression: unavailable
  numerical_legacy_checkpoint_regression_reason: no acoustic or variance checkpoint is present in the workspace
  onnx:
    opset: 15
    torch: 1.13.1
    runtime_host_version: 1.23.0
    batch_size: 1
    dynamic_axis: frames

contracts:
  configuration:
    dit_contract_version: 1
    unknown_backbone_args: reject
    silently_filtered_backbone_args: forbidden
    allowed_backbone_args:
      - num_layers
      - num_channels
      - num_heads
      - mlp_ratio
      - time_embed_dim
      - patch_size
      - rope_base
      - layer_norm_eps
      - attention_dropout
      - mlp_dropout
      - use_gradient_checkpointing
  backbone:
    spec: [B, F, M, T]
    diffusion_step: [B]
    condition: [B, H, T]
    output: [B, F, M, T]
    valid_mask: [B, T]
    valid_mask_true_is_valid: true
    valid_mask_source: mel2ph > 0
  acoustic_output: [B, T, 128]
  pitch_output: [B, T]
  multi_variance_output: [B, F, T]
  checkpoint:
    architecture_fields:
      - backbone_type
      - backbone_args
      - diffusion_type
      - time_scale_factor
      - spec_min
      - spec_max
    incompatible_architecture_load: reject
    lora_base_mismatch: reject

integration_points:
  - path: modules/backbones/__init__.py
    responsibility: register dit and validate its exact argument schema
  - path: modules/toplevel.py
    responsibility: construct acoustic, pitch and multi-variance predictors and supply valid masks
  - path: modules/fastspeech/param_adaptor.py
    responsibility: preserve repeat-bin ordering and supply the multi-variance mask
  - path: modules/core/ddpm.py
    responsibility: pass valid masks to capable noise-prediction backbones
  - path: modules/core/reflow.py
    responsibility: pass valid masks to capable velocity backbones without changing time scaling
  - path: training/acoustic_task.py
    responsibility: preserve acoustic loss masking and checkpoint metadata
  - path: training/variance_task.py
    responsibility: preserve pitch and variance loss masking and checkpoint metadata
  - path: inference/optimization.py
    responsibility: gate tracing and linear replacement by backend capability
  - path: deployment/exporters/acoustic_exporter.py
    responsibility: preserve the legacy acoustic package protocol and opset path
  - path: deployment/exporters/variance_exporter.py
    responsibility: preserve the legacy variance package protocol and opset path
  - path: deployment/modules/dit.py
    responsibility: lower mask-aware DiT to a three-argument opset-15 basic-operator backbone

minimal_matrix:
  - id: legacy-config-acoustic
    config: configs/original/acoustic.yaml
    sample: samples/00_我多想说再见啊_triple.ds
    expected_backbone: lynxnet2
  - id: legacy-config-variance-pitch
    config: configs/original/variance.yaml
    sample: samples/02_不老梦_variance.ds
    expected_backbone: lynxnet2
  - id: dit-config-acoustic
    config: configs/templates/config_acoustic_dit.yaml
    sample: samples/00_我多想说再见啊_triple.ds
    expected_backbone: dit
  - id: dit-config-variance-pitch
    config: configs/templates/config_variance_dit.yaml
    sample: samples/02_不老梦_variance.ds
    expected_backbone: dit
  - id: dit-config-variance-multi
    config: configs/templates/config_variance_dit.yaml
    sample: samples/02_不老梦_variance.ds
    expected_backbone: dit

