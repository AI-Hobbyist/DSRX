base_config:
  - configs/original/acoustic.yaml

backbone_type: dslight
backbone_args:
  num_channels: 192
  num_layers: 12
  kernel_size: 7
  dilation_cycle: [1, 3, 9, 27, 81]
  cond_channels: 256
  time_embed_dim: 64
  dropout_rate: 0.0

shallow_diffusion_args:
  train_aux_decoder: true
  train_diffusion: true
  val_gt_start: false
  aux_decoder_arch: dslight
  aux_decoder_args:
    num_channels: 128
    num_layers: 4
    kernel_size: 7
    dilation_cycle: [1, 3, 9]
    dropout_rate: 0.0
  aux_decoder_grad: 0.1

# The inherited LoRA base checkpoint belongs to a different architecture.
lora:
  enabled: false
  base_ckpt: null
