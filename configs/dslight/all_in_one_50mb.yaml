# Experimental FP32 all-in-one size reference. Fill dataset and vocoder paths
# in a copy before training. This is not a quality-qualified model.
base_config:
  - configs/templates/all_in_one_lynxnet2_muon.yaml

hidden_size: 192
backbone_type: dslight
backbone_args:
  num_channels: 128
  num_layers: 8
  kernel_size: 7
  dilation_cycle: [1, 3, 9, 27]
  cond_channels: 192
  time_embed_dim: 64
  dropout_rate: 0.0

shallow_diffusion_args:
  aux_decoder_arch: dslight
  aux_decoder_args:
    num_channels: 128
    num_layers: 4
    kernel_size: 7
    dilation_cycle: [1, 3, 9]
    dropout_rate: 0.0

pitch_prediction_args:
  backbone_type: dslight
  backbone_args:
    num_channels: 96
    num_layers: 6
    kernel_size: 7
    dilation_cycle: [1, 3, 9]
    cond_channels: 192
    time_embed_dim: 64
    dropout_rate: 0.0

variances_prediction_args:
  backbone_type: dslight
  backbone_args:
    num_channels: 96
    num_layers: 6
    kernel_size: 7
    dilation_cycle: [1, 3, 9]
    cond_channels: 192
    time_embed_dim: 64
    dropout_rate: 0.0

dur_prediction_args:
  hidden_size: 128
  num_layers: 3
