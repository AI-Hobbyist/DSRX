# One-stop preprocessing template, reused by acoustic/variance and vocoder.
# Edit dataset/audio/extraction settings here; no network configuration needed.
# Reused by all-in-one and independent audio-only vocoder preprocessing.
datasets:
- raw_data_dir: data/opencpop_zh
  speaker: opencpop
  spk_id: 0
  language: zh
  test_prefixes:
  - '2033001224'
  - '2070002621'
  - '2012000457'
  - '2003000103'
  - '2082003039'

# Shared waveform, mel and pitch contract; no model/network settings.
audio_sample_rate: 44100
audio_num_mel_bins: 128
hop_size: 512
fft_size: 2048
win_size: 2048
fmin: 40
fmax: 16000
mel_base: e
pe: rmvpe
pe_ckpt: ckpt/rmvpe/model.pt
f0_min: 40
f0_max: 2000
hnsep: vr
hnsep_ckpt: ckpt/vr/model.pt
hnsep_sample_rate: 44100

# Standalone binary package, also used by all-in-one joint training.
binarization_args:
  num_workers: 2
all_in_one:
  enabled: true
  mini_ddsp:
    enabled: true
    harmonics: 128
    harmonic_analysis_cycles: 4
    # Runtime augmentation; validation is always unaugmented.
    segment_frames: 128
    training_augmentation:
      random_crop: true
      volume_enabled: true
      log_volume_min: -1.0
      log_volume_max: 1.0

binary_data_dir: data/pre/binary/all_in_one_mini_ddsp_cloud
